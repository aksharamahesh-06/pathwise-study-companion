services:
  - type: web
    name: pathwise-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: pathwise-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: pathwise-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pathwise-api
          envVarKey: RENDER_EXTERNAL_URL
